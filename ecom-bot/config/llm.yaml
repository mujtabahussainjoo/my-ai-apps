# LLM provider configuration. Selection is config-only; agents never import provider SDKs.
# Env overrides: LLM__PROVIDER, LLM__MODEL, LLM__ANTHROPIC_API_KEY, ...

llm:
  provider: mock                 # mock | anthropic | openai | gemini | ollama | openai_compatible
  model: claude-sonnet-4-5
  router_provider: mock          # may differ from the generation provider
  router_model: null
  embedding_provider: mock       # mock | openai | ollama | huggingface
  embedding_model: text-embedding-3-small
  embedding_dimensions: 1536
  timeout_seconds: 60
  max_retries: 3

  # Optional retry/backoff tuning
  retry_backoff_base_seconds: 0.5
  retry_backoff_max_seconds: 8.0

  # Provider credentials/base URLs (override via env; never commit real values)
  anthropic_api_key: null
  anthropic_base_url: null
  openai_api_key: null
  openai_base_url: null
  google_api_key: null
  ollama_base_url: http://localhost:11434
  ollama_embed_model: nomic-embed-text
  openai_compatible_base_url: null
  openai_compatible_api_key: null
  openai_compatible_model: null
