[project]
name = "ecommerce-support"
version = "0.1.0"
description = "Production-oriented e-commerce AI support assistant (multi-agent, RAG, multi-provider LLM)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.1,<26.0",
    "pyjwt>=2.8,<3.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=4.2,<6.0",
    "beautifulsoup4>=4.12,<5.0",
    "langgraph>=0.2,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-anthropic>=0.2,<1.0",
    "langchain-openai>=0.2,<1.0",
    "langchain-google-genai>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "aiosqlite>=0.20,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-pyyaml>=6.0",
    "time-machine>=2.14,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_support"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
exclude = [".venv", "alembic/versions", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async correctness
    "C4",     # comprehensions
    "PTH",    # pathlib
    "T20",    # no print() in src
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "S101", "B011"]
"scripts/*" = ["T20"]
"src/ecommerce_support/main.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_support", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
packages = ["ecommerce_support"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = [
    "langchain.*",
    "langgraph.*",
    "langchain_core.*",
    "langchain_anthropic.*",
    "langchain_openai.*",
    "langchain_google_genai.*",
    "pgvector.*",
    "yaml.*",
    "jwt.*",
    "structlog.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --tb=short"
filterwarnings = [
    # Known asyncpg/SQLAlchemy teardown artifact: a pooled connection closed while a
    # transaction unwinds schedules an internal cancel coroutine that GC reports as
    # unawaited. Not caused by project code; harmless.
    "ignore:coroutine 'Connection\\._cancel' was never awaited:RuntimeWarning",
]
markers = [
    "integration: requires PostgreSQL (docker compose db service)",
    "security: security/regression tests",
    "e2e: end-to-end scenario tests",
]

[tool.coverage.run]
source = ["src/ecommerce_support"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
