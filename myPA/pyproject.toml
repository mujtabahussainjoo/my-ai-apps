[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mypa"
version = "0.1.0"
description = "myPA - Personal AI agent (OpenCode-compatible, cross-platform)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.scripts]
mypa = "mypa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mypa*"]
