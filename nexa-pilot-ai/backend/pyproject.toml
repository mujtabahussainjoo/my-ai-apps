[project]
name = "nexapilot"
version = "0.1.0"
description = "NexaPilot AI backend — desktop personal AI assistant (FastAPI + LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "keyring>=25.2,<26.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "langgraph>=0.2.60,<0.7",
    "langchain-core>=0.3,<0.5",
    "python-multipart>=0.0.9,<1.0",
    "structlog>=24.1,<26.0",
    "icalendar>=6.0,<7.0",
    "langgraph-checkpoint-sqlite>=2.0,<4.0",
]

[project.scripts]
nexapilot = "nexapilot.main:main"

[project.optional-dependencies]
packaging = ["pyinstaller>=6.10,<7.0"]

[dependency-groups]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-python-dateutil>=2.9",
    "httpx>=0.28.1",
    "pytest-mock>=3.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexapilot"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [".venv", "build", "dist", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC",
    "C4",
    "PTH",
    "T20",
    "ASYNC109",  # explicit timeout parameters are intentional: callers own the budget
]
ignore = [
    "E501",
    "B008",
    "RUF001",  # ambiguous unicode in user-facing strings; not used for identifiers
    "RUF002",
    "RUF003",
    "ASYNC109",  # explicit timeout parameters are intentional: callers own the budget
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "S101", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["nexapilot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
packages = ["nexapilot"]

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "langchain_core.*",
    "icalendar.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers --tb=short"
markers = [
    "integration: requires network-free external service stubs",
    "security: security / approval-gate regression tests",
]

[tool.coverage.run]
source = ["src/nexapilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
