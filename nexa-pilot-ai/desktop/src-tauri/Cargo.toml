[package]
name = "nexapilot-desktop"
version = "0.1.0"
description = "NexaPilot AI desktop shell"
authors = ["NexaPilot"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexapilot_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
